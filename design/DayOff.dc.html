<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C7DB1E; } a:hover { color: #DCEF3B; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #131410; color: #EDEEE1; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 62px 20px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 44px; height: 44px; margin-left: -11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></div>
      <div style="flex-grow: 1; height: 4px; background: #22251C; border-radius: 2px; overflow: hidden;">
        <div style="width: 66%; height: 100%; background: #C7DB1E;"></div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8C907F;">2/3</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 30px 20px 0;">

    <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #2C3025; background: #16180F; border-radius: 3px; padding: 14px 16px;">
      <div style="width: 10px; height: 10px; border: 1px dashed #8C907F; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; font-size: 13px; color: #C2C5B3;">Day off recorded. Two quick questions and you are done.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25;">Why not?</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="padding: 13px 18px; border-radius: 3px; background: #C7DB1E; border: 1px solid #C7DB1E; color: #131410; font-size: 15px; font-weight: 600;">Day off</div>
        <div style="padding: 13px 18px; border-radius: 3px; background: #1B1D16; border: 1px solid #2C3025; color: #C2C5B3; font-size: 15px; font-weight: 500;">Travel day</div>
        <div style="padding: 13px 18px; border-radius: 3px; background: #1B1D16; border: 1px solid #2C3025; color: #C2C5B3; font-size: 15px; font-weight: 500;">Not needed</div>
        <div style="padding: 13px 18px; border-radius: 3px; background: #1B1D16; border: 1px solid #2C3025; color: #C2C5B3; font-size: 15px; font-weight: 500;">Other</div>
      </div>
    </div>

    <div style="height: 1px; background: #2C3025;"></div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25;">Was catering provided for you today?</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; height: 68px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #1B1D16; border: 1px solid #2C3025; color: #C2C5B3; font-size: 18px; font-weight: 700;">No</div>
        <div style="flex-grow: 1; height: 68px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #C7DB1E; color: #131410; font-size: 18px; font-weight: 700;">Yes</div>
      </div>
    </div>

  </div>

  <div style="padding: 0 20px 34px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 12px; line-height: 1.5; color: #8C907F;">A day off still counts as filed. It is only a miss if nothing is sent at all.</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #C7DB1E; color: #131410; font-size: 16px; font-weight: 700;">Submit</div>
  </div>

</div>
