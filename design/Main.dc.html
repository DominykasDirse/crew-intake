<!doctype html>
<html>

<x-dc>

</helmet>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 18px; height: 3px; background: #C7DB1E;"></div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8C907F;">T26 · BOCELLI EU · CREW</div>
      </div>
      <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05;">Tuesday 2 Sep</div>
      <div style="font-size: 14px; color: #C2C5B3;">Vilnius · Žalgirio arena · show <span style="font-family: 'JetBrains Mono', monospace;">20:00</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">

      <div style="background: #C7DB1E; color: #131410; padding: 26px 22px; display: flex; flex-direction: column; gap: 10px; border-radius: 3px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="font-size: 25px; font-weight: 700; letter-spacing: -0.015em;">Report today</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; background: #131410; color: #C7DB1E; padding: 4px 8px; border-radius: 2px;">DUE</div>
        </div>
        <div style="font-size: 13px; line-height: 1.45; opacity: 0.78;">Seven questions. About two minutes.</div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#131410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;">6h 13m left</div>
        </div>
      </div>

      <div style="border: 1px solid #2C3025; background: #1B1D16; padding: 18px 20px; display: flex; align-items: center; gap: 14px; border-radius: 3px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg>

          <div style="font-size: 16px; font-weight: 600;">Upload invoice</div>
          <div style="font-size: 12px; color: #8C907F;">Receipts, fuel, tolls</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8C907F;">Last seven days</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #C2C5B3;">6 of 7</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="flex-grow: 1; height: 38px; background: #C7DB1E; border-radius: 2px;"></div>
        <div style="flex-grow: 1; height: 38px; background: #C7DB1E; border-radius: 2px;"></div>
        <div style="flex-grow: 1; height: 38px; border: 1px dashed #3E4333; background: #1B1D16; border-radius: 2px;"></div>
        <div style="flex-grow: 1; height: 38px; background: #C7DB1E; border-radius: 2px;"></div>
        <div style="flex-grow: 1; height: 38px; background: #C7DB1E; border-radius: 2px;"></div>
        <div style="flex-grow: 1; height: 38px; background: #C7DB1E; border-radius: 2px;"></div>
        <div style="flex-grow: 1; height: 38px; background: #C7DB1E; border-radius: 2px;"></div>
      </div>
      <div style="display: flex; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 9px; height: 9px; background: #C7DB1E;"></div><span style="font-size: 11px; color: #8C907F;">Filed</span></div>
        <div style="display: flex; align-items: center; gap: 6px;"><div style="width: 9px; height: 9px; border: 1px dashed #3E4333;"></div><span style="font-size: 11px; color: #8C907F;">Day off</span></div>
      </div>
    </div>

  </div>

  <div style="border-top: 1px solid #2C3025; background: #16180F; display: flex; padding: 10px 0 26px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C7DB1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="1"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #C7DB1E;">Today</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M12 8v4l3 2"></path></svg>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8C907F;">History</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8C907F;">Settings</div>
    </div>
  </div>

</div>
