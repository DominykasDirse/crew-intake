<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C7DB1E; } a:hover { color: #DCEF3B; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #131410; color: #EDEEE1; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 62px 20px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 44px; height: 44px; margin-left: -11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></div>
      <div style="flex-grow: 1; height: 4px; background: #22251C; border-radius: 2px; overflow: hidden;">
        <div style="width: 43%; height: 100%; background: #C7DB1E;"></div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8C907F;">3/7</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 0 20px;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #C7DB1E;">Rating</div>
      <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance;">How would you rate today?</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; gap: 8px;">
        <div onClick="{{ pick1 }}" style="{{ s1 }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;">1</span></div>
        <div onClick="{{ pick2 }}" style="{{ s2 }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;">2</span></div>
        <div onClick="{{ pick3 }}" style="{{ s3 }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;">3</span></div>
        <div onClick="{{ pick4 }}" style="{{ s4 }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;">4</span></div>
        <div onClick="{{ pick5 }}" style="{{ s5 }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;">5</span></div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <div style="font-size: 12px; color: #8C907F;">Bad night</div>
        <div style="font-size: 12px; color: #8C907F;">Went well</div>
      </div>
    </div>

    <div style="min-height: 22px; font-size: 15px; color: #C2C5B3;">{{ caption }}</div>

  </div>

  <div style="padding: 0 20px 34px; display: flex; flex-direction: column; gap: 12px;">
    <div style="{{ nextStyle }}">Next</div>
    <div style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8C907F;">Skip this question</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C7DB1E","section":"Theme"}}'>
class Component extends DCLogic {
  block(n, picked, accent) {
    const on = picked === n;
    return [
      'flex-grow: 1', 'height: 88px', 'display: flex', 'align-items: center',
      'justify-content: center', 'border-radius: 3px', 'cursor: pointer',
      'user-select: none', 'transition: background 120ms ease',
      on ? 'background: ' + accent : 'background: #1B1D16',
      on ? 'color: #131410' : 'color: #8C907F',
      on ? 'border: 1px solid ' + accent : 'border: 1px solid #2C3025'
    ].join('; ');
  }
  renderVals() {
    const accent = this.props.accent ?? '#C7DB1E';
    const picked = this.state && this.state.picked ? this.state.picked : null;
    const captions = {
      1: 'Something went badly wrong.',
      2: 'Harder than it should have been.',
      3: 'Ordinary night.',
      4: 'Ran well, minor niggles.',
      5: 'Everything worked.'
    };
    const set = (n) => () => this.setState({ picked: n });
    return {
      s1: this.block(1, picked, accent),
      s2: this.block(2, picked, accent),
      s3: this.block(3, picked, accent),
      s4: this.block(4, picked, accent),
      s5: this.block(5, picked, accent),
      pick1: set(1), pick2: set(2), pick3: set(3), pick4: set(4), pick5: set(5),
      caption: picked ? captions[picked] : 'Tap a number. One tap moves you on.',
      nextStyle: [
        'height: 56px', 'display: flex', 'align-items: center', 'justify-content: center',
        'border-radius: 3px', 'font-size: 16px', 'font-weight: 700',
        'letter-spacing: 0.02em', 'cursor: pointer', 'user-select: none',
        picked ? 'background: ' + accent : 'background: #22251C',
        picked ? 'color: #131410' : 'color: #5E6252'
      ].join('; ')
    };
  }
}
</script>
</body>
</html>
