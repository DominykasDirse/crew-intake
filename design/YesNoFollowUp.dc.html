<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C7DB1E; } a:hover { color: #DCEF3B; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #131410; color: #EDEEE1; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 62px 20px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 44px; height: 44px; margin-left: -11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8C907F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></div>
      <div style="flex-grow: 1; height: 4px; background: #22251C; border-radius: 2px; overflow: hidden;">
        <div style="width: 71%; height: 100%; background: #C7DB1E;"></div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8C907F;">5/7</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 26px; padding: 40px 20px 0;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #C7DB1E;">Yes / no</div>
      <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance;">Any equipment fault or damage?</div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div onClick="{{ pickNo }}" style="{{ noStyle }}">No</div>
      <div onClick="{{ pickYes }}" style="{{ yesStyle }}">Yes</div>
    </div>

    <sc-if value="{{ showFollow }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px; border-top: 1px solid #2C3025; padding-top: 22px;">

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 14px; font-weight: 600; color: #C2C5B3;">Which equipment, and what happened?</div>
          <div style="border: 1px solid #2C3025; background: #1B1D16; border-radius: 3px; padding: 14px; min-height: 84px; font-size: 15px; color: #5E6252;">Moving head 4, house left — stopped panning during the second half…</div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; border: 1px dashed #3E4333; background: #16180F; border-radius: 3px; padding: 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C7DB1E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="12.5" r="3.5"></circle></svg>
          <div style="flex-grow: 1; font-size: 15px; font-weight: 600;">Add a photo</div>
          <div style="font-size: 12px; color: #8C907F;">optional</div>
        </div>

        <div style="display: flex; align-items: flex-start; gap: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DAA93F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 2px; flex-shrink: 0;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9L2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
          <div style="font-size: 12px; line-height: 1.5; color: #8C907F;">Answering yes opens an item for the production office. It stays open until someone closes it.</div>
        </div>

      </div>
    </sc-if>

  </div>

  <div style="padding: 0 20px 34px;">
    <div style="{{ nextStyle }}">Next</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C7DB1E","section":"Theme"}}'>
class Component extends DCLogic {
  btn(active, accent, danger) {
    return [
      'flex-grow: 1', 'height: 76px', 'display: flex', 'align-items: center',
      'justify-content: center', 'border-radius: 3px', 'font-size: 19px',
      'font-weight: 700', 'cursor: pointer', 'user-select: none',
      'transition: background 120ms ease',
      active ? 'background: ' + (danger ? '#E3765F' : accent) : 'background: #1B1D16',
      active ? 'color: #131410' : 'color: #C2C5B3',
      active ? 'border: 1px solid transparent' : 'border: 1px solid #2C3025'
    ].join('; ');
  }
  renderVals() {
    const accent = this.props.accent ?? '#C7DB1E';
    const answer = this.state && this.state.answer ? this.state.answer : 'yes';
    return {
      yesStyle: this.btn(answer === 'yes', accent, true),
      noStyle: this.btn(answer === 'no', accent, false),
      pickYes: () => this.setState({ answer: 'yes' }),
      pickNo: () => this.setState({ answer: 'no' }),
      showFollow: answer === 'yes',
      nextStyle: [
        'height: 56px', 'display: flex', 'align-items: center', 'justify-content: center',
        'border-radius: 3px', 'font-size: 16px', 'font-weight: 700',
        'cursor: pointer', 'user-select: none',
        'background: ' + accent, 'color: #131410'
      ].join('; ')
    };
  }
}
</script>
</body>
</html>
